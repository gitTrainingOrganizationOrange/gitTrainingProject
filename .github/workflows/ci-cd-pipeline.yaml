name: CI/CD Pipeline

on:
  push:
    branches: [ 'ft/**' ]
  pull_request:
    branches: [ dev ]

jobs:

  validate-branch-name:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Verify branch name is "dev" or starts with "ft/" or "hf/"
      run: |
        branch_name="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
        if [[ "$branch_name" != ft/* ]] && [[ "$branch_name" != hf/* ]] && [[ "$branch_name" != "dev" ]]; then
          echo "Branch name ($branch_name) does not start with 'ft/' or 'hf/', and is not 'dev' or 'master'"
          exit 1
        else
          echo "Branch name ($branch_name) is valid."
        fi

  # Simple test job
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # - name: Run tests
    #   run: |
    #     echo "Running tests..."
    #     echo "test"
    #     echo "All tests passed!"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install project dependencies
        pip install -r ci_cd_training/src/requirements.txt

    - name: Lint with flake8
      run: |
        echo "Running flake8 linting..."
        # Use existing .flake8 config file
        echo "Using existing flake8 configuration..."
        
        # Lint specific files and directories using your config
        flake8 ci_cd_training/src/main.py --count --select=E9,F63,F7,F82 --show-source --statistics || echo "Syntax errors found"

    - name: Security check with bandit
      run: |
        echo "Running security checks..."
        # Check main.py and other Python files
        bandit ci_cd_training/src/main.py -f json -o bandit-main-report.json || echo "Security issues found in main.py"
        bandit -r ci_cd_training/src/ -ll -f json -o bandit-report.json || echo "Security scan completed with findings"
        
        # Show results
        echo "Bandit security scan results:"
        bandit ci_cd_training/src/main.py || true
        bandit -r ci_cd_training/src/ -ll || true
        

