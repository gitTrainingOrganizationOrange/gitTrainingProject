name: CI/CD Pipeline

on:
  pull_request:
    branches: 
      - '**'
  push:
    branches:
      - '**'

env:
  TERRAFORM_DIR: ci_cd_training/terraform
  PYTHON_DIR: ci_cd_training/src

jobs:
  # First job: Python code quality and security
  python-quality-security:
    name: "Python Code Quality and Security Check"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ env.PYTHON_DIR }}/requirements.txt
          pip install black flake8 bandit[toml] pip-audit mypy pytest pytest-cov

      - name: Run Black (code formatting check)
        id: black
        run: |
          echo "::group::Black - Code Formatting"
          black --check --diff ${{ env.PYTHON_DIR }}/
          echo "::endgroup::"
        continue-on-error: true

      - name: Run Flake8 (linting)
        id: flake8
        run: |
          echo "::group::Flake8 - Linting"
          flake8 ${{ env.PYTHON_DIR }}/ --max-line-length=100 --exclude=__pycache__
          echo "::endgroup::"
        continue-on-error: true

      - name: Run Bandit (security linting)
        id: bandit
        run: |
          echo "::group::Bandit - Security Analysis"
          if [ -f "${{ env.PYTHON_DIR }}/.bandit" ]; then
            bandit -r ${{ env.PYTHON_DIR }}/ -ll --ini ${{ env.PYTHON_DIR }}/.bandit
          else
            bandit -r ${{ env.PYTHON_DIR }}/ -ll --skip B104
          fi
          echo "::endgroup::"
        continue-on-error: true

      - name: Run pip-audit (dependency vulnerability check)
        id: pip-audit
        run: |
          echo "::group::pip-audit - Dependency Security"
          pip-audit -r ${{ env.PYTHON_DIR }}/requirements.txt
          echo "::endgroup::"
        continue-on-error: true

      - name: Run MyPy (type checking)
        id: mypy
        run: |
          echo "::group::MyPy - Type Checking"
          mypy ${{ env.PYTHON_DIR }}/ --ignore-missing-imports
          echo "::endgroup::"
        continue-on-error: true

      - name: Run pytest (if tests exist)
        id: pytest
        run: |
          echo "::group::Pytest - Unit Tests"
          if [ -d "${{ env.PYTHON_DIR }}/tests" ] || find ${{ env.PYTHON_DIR }} -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            pytest ${{ env.PYTHON_DIR }}/ -v --cov=${{ env.PYTHON_DIR }} --cov-report=term-missing
          else
            echo "No tests found, skipping pytest"
          fi
          echo "::endgroup::"
        continue-on-error: true

      - name: Python Quality Summary
        if: always()
        run: |
          echo "## Python Quality Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Black (Formatting) | ${{ steps.black.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Flake8 (Linting) | ${{ steps.flake8.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bandit (Security) | ${{ steps.bandit.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| pip-audit (Dependencies) | ${{ steps.pip-audit.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| MyPy (Type Checking) | ${{ steps.mypy.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pytest (Unit Tests) | ${{ steps.pytest.outcome }} |" >> $GITHUB_STEP_SUMMARY
          
          # Fail the job if any critical checks failed
          if [[ "${{ steps.black.outcome }}" == "failure" ]] || \
             [[ "${{ steps.flake8.outcome }}" == "failure" ]] || \
             [[ "${{ steps.bandit.outcome }}" == "failure" ]]; then
            echo ""
            echo "❌ Critical Python quality checks failed!"
            exit 1
          else
            echo ""
            echo "✅ All critical Python checks passed!"
          fi

  # Second job: Terraform quality and security
  terraform-quality-security:
    name: "Terraform Quality and Security Checks"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: 1.6.6

      - name: Terraform Format Check
        id: fmt
        run: |
          echo "::group::Terraform Format Check"
          terraform -chdir=${{ env.TERRAFORM_DIR }} fmt -check -recursive
          echo "::endgroup::"
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: |
          echo "::group::Terraform Init"
          terraform -chdir=${{ env.TERRAFORM_DIR }} init -backend=false
          echo "::endgroup::"

      - name: Terraform Validate
        id: validate
        run: |
          echo "::group::Terraform Validate"
          terraform -chdir=${{ env.TERRAFORM_DIR }} validate
          echo "::endgroup::"
        continue-on-error: true

      - name: Run tfsec Security Scanner
        id: tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: ${{ env.TERRAFORM_DIR }}
          soft_fail: false
          format: default
        continue-on-error: true

      - name: Setup Python for Checkov
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Checkov Security Scanner
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ env.TERRAFORM_DIR }}
          quiet: false
          soft_fail: false
          framework: terraform
          output_format: cli
          download_external_modules: true
        continue-on-error: true

      - name: Terraform Quality Summary
        if: always()
        run: |
          echo "## Terraform Quality Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Format Check | ${{ steps.fmt.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Validation | ${{ steps.validate.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| tfsec Security | ${{ steps.tfsec.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Checkov Security | ${{ steps.checkov.outcome }} |" >> $GITHUB_STEP_SUMMARY
          
          # Fail if critical checks failed
          if [[ "${{ steps.fmt.outcome }}" == "failure" ]] || \
             [[ "${{ steps.validate.outcome }}" == "failure" ]]; then
            echo ""
            echo "❌ Critical Terraform checks failed!"
            exit 1
          else
            echo ""
            echo "✅ All critical Terraform checks passed!"
          fi

  # Third job: Terraform Plan/Apply - ONLY runs if Python checks pass
  terraform-deploy:
    name: "Terraform Deploy - ${{ github.base_ref || github.ref_name }}"
    needs: [python-quality-security, terraform-quality-security]
    # STRICT DEPENDENCY: Both Python and Terraform checks must pass
    if: |
      needs.python-quality-security.result == 'success' && 
      needs.terraform-quality-security.result == 'success'
    
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Auth in GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        run: terraform -chdir=${{ env.TERRAFORM_DIR }} init -upgrade -reconfigure

      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request' || github.ref_name != 'master'
        run: |
          echo "::group::Terraform Plan"
          terraform -chdir=${{ env.TERRAFORM_DIR }} plan -var-file=env/dev.tfvars -out=tfplan -no-color | tee plan_output.txt
          echo "::endgroup::"
        continue-on-error: true

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v3
        if: github.event_name == 'pull_request'
        with:
          name: terraform-plan-${{ github.event.pull_request.number }}
          path: |
            ${{ env.TERRAFORM_DIR }}/tfplan
            plan_output.txt
          retention-days: 7

      - name: Update Pull Request
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request' && always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let planOutput = 'No plan output available';
            try {
              planOutput = fs.readFileSync('plan_output.txt', 'utf8');
            } catch (err) {
              console.log('Could not read plan output:', err);
            }
            
            const output = `### 🚀 CI/CD Pipeline Results
            
            #### 🐍 Python Quality: \`${{ needs.python-quality-security.result }}\`
            #### 🔧 Terraform Quality: \`${{ needs.terraform-quality-security.result }}\`
            #### 📋 Terraform Plan: \`${{ steps.plan.outcome }}\`
            
            <details><summary>📄 Show Terraform Plan</summary>
            
            \`\`\`terraform
            ${planOutput}
            \`\`\`
            
            </details>
            
            **Note:** Check the workflow summary for detailed quality check results.
            
            *Triggered by: @${{ github.actor }}, Event: \`${{ github.event_name }}\`*`;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' && comment.body.includes('CI/CD Pipeline Results')
            });
            
            // Update or create comment
            if (botComment) {
              github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              });
            } else {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              });
            }

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: |
          echo "❌ Terraform plan failed!"
          exit 1

      - name: Terraform Apply
        if: github.ref_name == 'master' && github.event_name == 'push'
        run: |
          echo "🚀 Applying Terraform changes to production..."
          terraform -chdir=${{ env.TERRAFORM_DIR }} apply -var-file=env/dev.tfvars -auto-approve
          echo "✅ Terraform apply completed successfully!"

  # Final job: Summary (always runs)
  pipeline-summary:
    name: "Pipeline Summary"
    if: always()
    needs: [python-quality-security, terraform-quality-security, terraform-deploy]
    runs-on: ubuntu-latest
    
    steps:
      - name: Generate Pipeline Summary
        run: |
          echo "# 📊 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python Quality | ${{ needs.python-quality-security.result }} | Code quality and security checks for Python |" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform Quality | ${{ needs.terraform-quality-security.result }} | Infrastructure code quality and security |" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform Deploy | ${{ needs.terraform-deploy.result }} | Plan/Apply infrastructure changes |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.terraform-deploy.result }}" == "skipped" ]]; then
            echo "⚠️ **Terraform deployment was skipped** because quality checks did not pass." >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.terraform-deploy.result }}" == "success" ]]; then
            echo "✅ **All checks passed!** Terraform changes have been successfully deployed." >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.terraform-deploy.result }}" == "failure" ]]; then
            echo "❌ **Deployment failed!** Please check the logs for details." >> $GITHUB_STEP_SUMMARY
          fi
